name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEBIUS_API_KEY: ''
      ACCESSFIX_TEST_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Type-check and build
        run: npm run build
      - name: Engine tests
        run: npm test
      - name: UI tests against the production build
        shell: bash
        run: |
          npm start > /tmp/accessfix-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/accessfix-server.log
            exit 1
          fi
          npm run test:ui
  container:
    name: Free-tier container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the deployment image
        run: docker build -t accessfix:judge-demo .
      - name: Verify the free-tier resource budget without inference
        run: node scripts/container-smoke.mjs
